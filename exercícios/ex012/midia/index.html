<body>
    <h1>Reproduzindo Vídeos Hospedados Localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video width="560px" poster="" autoplay controls loop>
        <source src="meuvideo.mp4" type="video/mp4">
        <source src="Meuvideo.mkv" type="video/mp4">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos</p>
    </video>
     
    <h1>Incorporando Vídeos Hospedados Externamente</h1>
    <h2>Do YouTube</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/7h5KLWbfOTc?si=mOfKlzgF2Thb6fJQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Do Vimeo</h2>
