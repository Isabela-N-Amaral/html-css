<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * {
            height: 100%;
        }
        body {
            background-image: linear-gradient(to bottom, rgb(126, 126, 235) 1%, rgb(177, 124, 238), rgb(221, 162, 106)100%);
            background-attachment: fixed;
        }
        h1 {
            color: rgb(247, 241, 232);
        }
    </style>
</head>
<body>
    <h1>Testando gradiente</h1>
</body>
</html>
