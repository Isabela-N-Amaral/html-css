<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Image</title>
    <style>
        .quad {
            display: inline-block;
            border: 1px solid black;
            background-color:rgb(167, 207, 207);
            width: 300px;
            height: 300px;
        }

        #q1 {
            background-color:rgb(82, 124, 124);
        }

        #q2 {
            background-image: linear-gradient(to bottom, rgb(218, 151, 194), rgb(143, 81, 124));
        }

        #q3 {
            background-image: url("imagens/pattern003.png");
        }
    </style>
</head>
<body>
    <div class="quad" id="q1">

    </div>

    <div class="quad" id="q2">

    </div>

    <div class="quad" id="q3">

    </div>
</body>
</html>
